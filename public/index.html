<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiscoBee by ByteHive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            line-height: 1.5;
        }

        .top-bar {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: white;
        }

        .brand-text {
            font-size: 20px;
            font-weight: 600;
            color: #f8fafc;
        }

        .version-badge {
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #94a3b8;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .status-dot.disconnected {
            background: #ef4444;
            animation: none;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px;
        }

        .header {
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 8px;
        }

        .header p {
            color: #94a3b8;
            font-size: 16px;
        }

        .controls {
            display: flex;
            gap: 16px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            min-width: 300px;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }

        #searchInput {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            color: #f8fafc;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        #searchInput:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        #searchInput::placeholder {
            color: #64748b;
        }

        .stats {
            display: flex;
            gap: 16px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 12px;
            padding: 20px 24px;
            flex: 1;
            min-width: 200px;
            transition: all 0.2s ease;
        }

        .stat-card:hover {
            background: rgba(15, 23, 42, 0.8);
            border-color: rgba(148, 163, 184, 0.2);
        }

        .stat-label {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-value {
            color: #f8fafc;
            font-size: 28px;
            font-weight: 700;
        }

        #sourceList {
            display: grid;
            gap: 24px;
        }

        .instance-group {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .instance-group:hover {
            border-color: rgba(148, 163, 184, 0.2);
            box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.3);
        }

        .instance-header {
            padding: 20px 24px;
            background: rgba(15, 23, 42, 0.8);
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .instance-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .instance-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .source-count {
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        .sources-list {
            list-style: none;
        }

        .source-item {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.05);
            transition: all 0.2s ease;
        }

        .source-item:last-child {
            border-bottom: none;
        }

        .source-item:hover {
            background: rgba(59, 130, 246, 0.05);
        }

        .source-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .source-name {
            font-size: 16px;
            font-weight: 600;
            color: #f8fafc;
            flex: 1;
        }

        .copy-button {
            padding: 8px 16px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            transition: all 0.2s ease;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.2);
        }

        .copy-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(59, 130, 246, 0.3);
        }

        .copy-button:active {
            transform: translateY(0);
        }

        .copy-button.copied {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .source-details {
            display: grid;
            gap: 8px;
            color: #94a3b8;
            font-size: 14px;
        }

        .detail-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-label {
            color: #64748b;
            font-weight: 500;
            min-width: 80px;
        }

        .detail-value {
            color: #e2e8f0;
            font-family: 'Courier New', monospace;
        }

        .groups {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .group-badge {
            background: rgba(148, 163, 184, 0.1);
            color: #cbd5e1;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            border: 1px solid rgba(148, 163, 184, 0.1);
        }

        .empty-state {
            text-align: center;
            padding: 80px 32px;
            color: #64748b;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 20px;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 15px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }

            .top-bar {
                padding: 12px 16px;
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }

            .header h1 {
                font-size: 24px;
            }

            .controls {
                flex-direction: column;
            }

            .search-wrapper {
                min-width: 100%;
            }

            .stats {
                flex-direction: column;
            }

            .source-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .source-name {
                word-break: break-all;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .instance-group {
            animation: fadeIn 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="brand">
            <div class="brand-logo">D</div>
            <div class="brand-text">DiscoBee</div>
            <div class="version-badge">v0.1</div>
        </div>
        <div class="status-indicator">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Connecting...</span>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>NDI Sources</h1>
            <p>Real-time monitoring of Network Device Interface sources</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Total Sources</div>
                <div class="stat-value" id="totalSources">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Active Instances</div>
                <div class="stat-value" id="totalInstances">0</div>
            </div>
        </div>

        <div class="controls">
            <div class="search-wrapper">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor">
                    <path d="M9 17A8 8 0 1 0 9 1a8 8 0 0 0 0 16z" stroke-width="2" stroke-linecap="round"/>
                    <path d="M19 19l-4.35-4.35" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <input type="text" id="searchInput" placeholder="Search sources by name, IP, or group...">
            </div>
        </div>

        <div id="sourceList"></div>
    </div>

    <script>
        const sourceList = document.getElementById('sourceList');
        const searchInput = document.getElementById('searchInput');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const totalSourcesEl = document.getElementById('totalSources');
        const totalInstancesEl = document.getElementById('totalInstances');

        let ws = null;
        let reconnectTimeout = null;

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('WebSocket connected');
                statusDot.classList.remove('disconnected');
                statusText.textContent = 'Connected';
            };

            ws.onmessage = (event) => {
                try {
                    const message = JSON.parse(event.data);
                    if (message.type === 'sources') {
                        displaySources(message.data);
                        updateStats(message.data);
                    }
                } catch (error) {
                    console.error('Error parsing WebSocket message:', error);
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
                statusDot.classList.add('disconnected');
                statusText.textContent = 'Disconnected';

                reconnectTimeout = setTimeout(() => {
                    console.log('Attempting to reconnect...');
                    connectWebSocket();
                }, 3000);
            };
        }

        function updateStats(sources) {
            totalSourcesEl.textContent = sources.length;
            const instances = groupByInstance(sources);
            totalInstancesEl.textContent = Object.keys(instances).length;
        }

        function displaySources(sources) {
            if (sources.length === 0) {
                sourceList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📡</div>
                        <h3>No NDI Sources Found</h3>
                        <p>Waiting for NDI sources to become available...</p>
                    </div>
                `;
                return;
            }

            const instances = groupByInstance(sources);
            const searchTerm = searchInput.value.toLowerCase();

            let html = '';
            for (const [instance, instanceSources] of Object.entries(instances)) {
                const filteredSources = instanceSources.filter(source => {
                    const searchText = `${source.name} ${source.address} ${source.port} ${source.groups.join(' ')}`.toLowerCase();
                    return searchText.includes(searchTerm);
                });

                if (filteredSources.length === 0) continue;

                html += `
                    <div class="instance-group">
                        <div class="instance-header">
                            <h2>
                                <div class="instance-icon">🖥️</div>
                                ${instance}
                            </h2>
                            <span class="source-count">${filteredSources.length} source${filteredSources.length !== 1 ? 's' : ''}</span>
                        </div>
                        <ul class="sources-list">
                `;

                filteredSources.forEach(source => {
                    html += `
                        <li class="source-item">
                            <div class="source-header">
                                <div class="source-name">${escapeHtml(source.name)}</div>
                                <button class="copy-button" data-name="${escapeHtml(source.name)}">Copy Name</button>
                            </div>
                            <div class="source-details">
                                <div class="detail-row">
                                    <span class="detail-label">IP Address</span>
                                    <span class="detail-value">${escapeHtml(source.address)}:${source.port}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">Groups</span>
                                    <div class="groups">
                                        ${source.groups.map(group => `<span class="group-badge">${escapeHtml(group)}</span>`).join('')}
                                    </div>
                                </div>
                            </div>
                        </li>
                    `;
                });

                html += `
                        </ul>
                    </div>
                `;
            }

            if (html === '') {
                sourceList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <h3>No Results Found</h3>
                        <p>Try adjusting your search terms</p>
                    </div>
                `;
            } else {
                sourceList.innerHTML = html;
            }

            document.querySelectorAll('.copy-button').forEach(button => {
                button.addEventListener('click', copySourceName);
            });
        }

        function groupByInstance(sources) {
            return sources.reduce((acc, source) => {
                const instance = source.address;
                if (!acc[instance]) {
                    acc[instance] = [];
                }
                acc[instance].push(source);
                return acc;
            }, {});
        }

        function copySourceName(event) {
            const sourceName = event.target.getAttribute('data-name');
            navigator.clipboard.writeText(sourceName).then(() => {
                const originalText = event.target.textContent;
                event.target.textContent = 'Copied!';
                event.target.classList.add('copied');
                setTimeout(() => {
                    event.target.textContent = originalText;
                    event.target.classList.remove('copied');
                }, 1500);
            }).catch(err => {
                console.error('Failed to copy text: ', err);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        searchInput.addEventListener('input', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'refresh' }));
            }
        });

        connectWebSocket();

        window.addEventListener('beforeunload', () => {
            if (reconnectTimeout) {
                clearTimeout(reconnectTimeout);
            }
            if (ws) {
                ws.close();
            }
        });
    </script>
</body>
</html>
