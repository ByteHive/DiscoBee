<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiscoBee by ByteHive</title>
    <script src="/axios.js"></script>
    <script src="/vue.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        .top-bar {
            background-color: #333;
            color: white;
            text-align: left;
            padding: 10px 20px;
            font-size: 18px;
        }
        .content {
            padding: 20px;
        }
        h1, h2 {
            color: #333;
        }
        #sourceList {
            list-style-type: none;
            padding: 0;
        }
        #sourceList li {
            background-color: #fff;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        #refreshButton, #searchInput {
            padding: 10px;
            margin-right: 10px;
            font-size: 16px;
        }
        #refreshButton {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #refreshButton:hover {
            background-color: #45a049;
        }
        #searchInput {
            width: 200px;
        }
        .instance-group {
            margin-bottom: 20px;
            background-color: #e9e9e9;
            padding: 10px;
            border-radius: 5px;
        }
        .copy-button {
            padding: 5px 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
        }
        .copy-button:hover {
            background-color: #0056b3;
        }
        ul{
            list-style: none!important;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="top-bar">
            DiscoBee by Bytehive - v0.1
        </div>
        <div class="content">
            <h1>NDI Sources</h1>
            <input type="text" v-model="searchTerm" placeholder="Search sources...">
            <button @click="fetchSources">Refresh Sources</button>
            <div id="sourceList">
                <div v-if="sources.length === 0" v-show="!loading">
                    <p>No NDI sources found</p>
                </div>
                <div v-if="loading">
                    <p>Loading sources...</p>
                </div>
                <div v-if="error">
                    <p>Failed to fetch NDI sources</p>
                </div>
                <div v-for="(instanceSources, instance) in filteredSourcesByInstance" :key="instance" class="instance-group" v-show="instanceSources.length > 0">
                    <h2>{{ instance }}</h2>
                    <ul>
                        <li v-for="source in instanceSources" :key="source.name">
                            <strong>Name:</strong> {{ source.name }}
                            <button class="copy-button" @click="copySourceName(source.name)">{{ getCopyButtonText(source.name) }}</button><br>
                            <strong>IP:</strong> {{ source.address }}:{{ source.port }}<br>
                            <strong>Groups:</strong> {{ source.groups.join(', ') }}
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        if (typeof Vue === 'undefined') {
            console.error('Vue is not loaded!');
            document.body.innerHTML = '<div style="color: red; padding: 20px;">Vue.js failed to load. Check your internet connection or CDN access.</div>';
        } else {
            const { createApp } = Vue;

            createApp({
                data() {
                    return {
                        sources: [],
                        searchTerm: '',
                        loading: false,
                        error: false,
                        copyButtonStates: {}
                    }
                },
                computed: {
                    filteredSourcesByInstance() {
                        const filtered = this.sources.filter(source => {
                            const searchLower = this.searchTerm.toLowerCase();
                            return source.name.toLowerCase().includes(searchLower) ||
                                   source.address.toLowerCase().includes(searchLower) ||
                                   source.groups.some(group => group.toLowerCase().includes(searchLower));
                        });
                        
                        return this.groupByInstance(filtered);
                    }
                },
                methods: {
                    async fetchSources() {
                        this.loading = true;
                        this.error = false;
                        try {
                            const response = await axios.get('/api/sources');
                            this.sources = response.data;
                        } catch (error) {
                            console.error('Error fetching sources:', error);
                            this.error = true;
                        } finally {
                            this.loading = false;
                        }
                    },
                    groupByInstance(sources) {
                        return sources.reduce((acc, source) => {
                            const instance = source.address;
                            if (!acc[instance]) {
                                acc[instance] = [];
                            }
                            acc[instance].push(source);
                            return acc;
                        }, {});
                    },
                    async copySourceName(sourceName) {
                        try {
                            await navigator.clipboard.writeText(sourceName);
                            this.copyButtonStates[sourceName] = 'Copied!';
                            setTimeout(() => {
                                this.copyButtonStates[sourceName] = 'Copy';
                            }, 1500);
                        } catch (err) {
                            console.error('Failed to copy text: ', err);
                        }
                    },
                    getCopyButtonText(sourceName) {
                        return this.copyButtonStates[sourceName] || 'Copy';
                    }
                },
                mounted() {
                    this.fetchSources();
                }
            }).mount('#app');
        }
    </script>
</body>
</html>
